<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IG 繁中竞品监控</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --fg: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --ok: #1f7a4d; --bad: #b3261e; --warn: #9a6400; --accent: #111111; --grid: #ecebe6;
    --c0: #111111; --c1: #d9a400; --c2: #3b82c4; --c3: #c2410c; --c4: #7c5cbf; --c5: #2f8f83;
    --muted-line: #c9c7c0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --fg: #f1efe9; --muted: #a3a19a; --line: #34332f;
      --ok: #5cc98f; --bad: #f2867d; --warn: #e2b04a; --accent: #f1efe9; --grid: #2a2a27;
      --c0: #f1efe9; --c1: #f0c040; --c2: #6aa9e0; --c3: #f08a4b; --c4: #a68be0; --c5: #5cc0b3;
      --muted-line: #55534d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", "Noto Sans CJK TC", sans-serif;
    font-size: 15px; line-height: 1.55; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 60px; display: grid; gap: 18px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .lede { margin: 6px 0 0; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
  .card h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .tile .lab { color: var(--muted); font-size: 12.5px; }
  .tile .val { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; line-height: 1.2; }
  .tile .note { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid currentColor; }
  .good { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .chart { position: relative; width: 100%; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: 6px 9px; font-size: 12.5px; white-space: nowrap; z-index: 3; }
  .tip .d { color: var(--muted); margin-bottom: 2px; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  th { text-align: right; color: var(--muted); font-weight: 500; font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, .l { text-align: left; }
  tr.me td { font-weight: 600; }
  td a { color: inherit; }
  .cap { max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  #chase .head-row { justify-content: flex-start; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; padding: 4px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--fg); color: var(--bg); }
  .empty { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
  svg text { fill: var(--muted); font-size: 12px; }
  @media (max-width: 640px) { .opt { display: none; } h1 { font-size: 22px; } .tile .val { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>IG 繁中竞品监控</h1>
    <p class="lede" id="lede">正在读取数据…</p>
    <div class="meta" id="meta"></div>
  </header>

  <section class="card">
    <h2>竞品对比</h2>
    <p class="sub">最新一次采集。日均净增按最近 14 天计算；互动率 =（点赞 + 评论）÷ 粉丝数，取近 30 天帖子的平均。</p>
    <div class="tablewrap"><table id="cmp"></table></div>
  </section>

  <section class="card">
    <div class="head-row">
      <h2>各平台粉丝增速</h2>
      <div class="seg" id="growth-range" role="group" aria-label="时间范围">
        <button type="button" data-days="7">近 7 天</button>
        <button type="button" data-days="30" class="on">近 30 天</button>
        <button type="button" data-days="90">近 90 天</button>
        <button type="button" data-days="0">全部</button>
      </div>
    </div>
    <p class="sub">以所选时间段第一天为起点，各账号粉丝累计增长了百分之几。用百分比比较，大号小号放在同一把尺子上看谁涨得快。</p>
    <div class="legend" id="growth-legend"></div>
    <div class="chart" id="growth-chart"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>每日净增粉</h2>
      <p class="sub">每个账号每天比前一天多了多少粉丝。</p>
      <div class="legend" id="gain-legend"></div>
      <div class="chart" id="gain-chart"></div>
    </section>
    <section class="card">
      <h2>更新频率与内容类型</h2>
      <p class="sub">近 30 天各账号发帖数。</p>
      <div class="legend">
        <span><i class="sw" style="background:var(--c2)"></i>Reels</span>
        <span><i class="sw" style="background:var(--c1)"></i>轮播</span>
        <span><i class="sw" style="background:var(--muted-line)"></i>图文</span>
      </div>
      <div class="chart" id="mix-chart"></div>
    </section>
  </div>

  <section class="card">
    <h2>爆款帖子 Top 15</h2>
    <p class="sub">近 30 天所有账号里互动率最高的帖子，点链接可打开原帖。</p>
    <div class="tablewrap"><table id="top"></table></div>
  </section>

  <section class="card" id="chase">
    <div class="head-row"><h2>追赶币安</h2><span id="chase-status"></span></div>
    <p class="sub" id="chase-sub"></p>
    <div class="tiles" id="chase-tiles"></div>
  </section>

  <section class="card">
    <h2>采集日志</h2>
    <p class="sub">最近 7 次自动采集的结果。</p>
    <div class="tablewrap"><table id="log"></table></div>
  </section>
</div>

<script src="assets/d3.min.js"></script>
<script src="assets/dashboard.js"></script>
</body>
</html>
