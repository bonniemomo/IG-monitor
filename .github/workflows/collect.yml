name: 每日采集 Instagram 数据

on:
  schedule:
    - cron: "7 1 * * *"   # 每天 UTC 01:07 = 北京/台北时间 09:07
  workflow_dispatch:       # 允许在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/collect.py

      - name: 保存数据（即使采集失败也保存日志）
        if: always()
        run: |
          git config user.name "ig-monitor-bot"
          git config user.email "ig-monitor-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有新数据"
          else
            git commit -m "数据更新 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
